<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>VRI Chat Deck — Returning to app</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #f6f7fb; background:#101116; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; }
    main { width:min(560px,100%); padding:30px; border:1px solid #343748; border-radius:20px; background:#181a22; box-shadow:0 20px 60px rgba(0,0,0,.35); }
    h1 { margin:0 0 12px; font-size:28px; }
    p { color:#bec3d2; line-height:1.5; }
    button { width:100%; margin-top:16px; padding:14px 18px; border:0; border-radius:12px; font-weight:800; font-size:16px; background:#9147ff; color:white; cursor:pointer; }
    small { display:block; margin-top:16px; color:#8d93a5; word-break:break-word; }
  </style>
</head>
<body>
  <main>
    <h1>Returning to VRI Chat Deck…</h1>
    <p>Twitch authorization is complete. This page should reopen the Chat Deck automatically.</p>
    <button id="returnButton" type="button">Return to Chat Deck</button>
    <small id="status">Preparing secure handoff…</small>
  </main>
  <script>
    (() => {
      const APP_RETURN = 'vri-chat-deck://oauth';
      const suffix = `${window.location.search || ''}${window.location.hash || ''}`;
      const target = `${APP_RETURN}${suffix}`;
      const status = document.getElementById('status');
      const button = document.getElementById('returnButton');

      function returnToApp() {
        status.textContent = 'Opening VRI Chat Deck…';
        window.location.href = target;
      }

      button.addEventListener('click', returnToApp);
      setTimeout(returnToApp, 150);
      setTimeout(() => {
        status.textContent = 'If the app did not open, tap “Return to Chat Deck.”';
      }, 1600);
    })();
  </script>
</body>
</html>
